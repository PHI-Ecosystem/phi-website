
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PHI Ecosystem</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #faf9f5;
      font-family: Georgia, serif;
    }
    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .artwork {
      display: block;
      width: 100%;
      max-width: 850px;
      height: auto;
      border: none;
outline: none;
box-shadow: none;
    }
    .logo {
      display: block;
      width: 110px;
      max-width: 30%;
      height: auto;
      margin: 28px auto;
    }
  </style>
</head>
<body>
  <main>
    <img class="artwork" src="phi-main.jpg"
         alt="PHI Ecosystem — Meaning, Ethics and Conscious Technology">
    <img class="logo" src="phi-logo.jpg"
         alt="PHI logo">
  </main>
</body>
</html>
