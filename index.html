
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PHI Ecosystem</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #faf9f5;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .artwork {
      position: relative;
      width: 100%;
      max-width: 600px;
    }

    .artwork img {
      display: block;
      width: 100%;
      height: auto;
    }

    .info {
      position: absolute;
      left: 85.5%;
      top: 84.5%;
      transform: translate(-50%, -50%);
      width: 9%;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111;
      font-family: Georgia, serif;
      font-style: italic;
font-weight: bold;
font-size: clamp(16px, 4vw, 27px);
      text-decoration: none;
      cursor: pointer;
    }

    .info:focus-visible {
      outline: 1px solid #111;
      outline-offset: 3px;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <main>
    <div class="artwork">
      <img src="phi-main.jpg" alt="PHI Ecosystem">
      <a
        class="info"
        href="PHI.pdf"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Information about PHI Ecosystem"
        title="About PHI"
      >i</a>
    </div>
  </main>
</body>
</html>
